services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-speech-serve:cpu
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs
      - hf_cache:/app/.cache
    environment:
      OSS_FRAMEWORK: ${OSS_FRAMEWORK:-faster_whisper}
      OSS_MODEL: ${OSS_MODEL:-tiny}
      OSS_DEVICE: ${OSS_DEVICE:-cpu}
      OSS_COMPUTE_TYPE: ${OSS_COMPUTE_TYPE:-int8}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  hf_cache:
