[project]
name = "open-speech-serve"
version = "0.1.0"
description = "Compact Whisper serving benchmark: HF vs faster-whisper under concurrent load + streaming TTFS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=14.0",
  "numpy>=2.0.0",
  "soundfile>=0.12.1",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.6.0",
  "faster-whisper>=1.1.0",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "jiwer>=3.0.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
prepare = "scripts.prepare_data:main"
cell = "scripts.run_cell:main"
sweep = "scripts.run_sweep:main"
analyze = "scripts.analyze:main"
plot = "scripts.plot_results:main"
stream = "streaming.server:main"
ttfs = "streaming.ttfs_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "bench", "streaming", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
