x-bench-client: &bench-client
  build:
    context: .
    dockerfile: docker/Dockerfile.bench
  image: open-speech-serve:bench
  working_dir: /app
  volumes:
    - ./data:/app/data
    - ./results:/app/results
    - ./configs:/app/configs

services:
  bench-client:
    <<: *bench-client
    profiles: ["vllm", "sglang", "triton"]
    command: ["sleep", "infinity"]

  vllm:
    profiles: ["vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.25.1}
    gpus: all
    ipc: host
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - openai/whisper-large-v3-turbo
      - --served-model-name
      - openai/whisper-large-v3-turbo
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.90"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  sglang:
    profiles: ["sglang"]
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.15}
    gpus: all
    ipc: host
    ports:
      - "8002:30000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - openai/whisper-large-v3-turbo
      - --served-model-name
      - openai/whisper-large-v3-turbo
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --dtype
      - float16
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  triton:
    profiles: ["triton"]
    build:
      context: .
      dockerfile: docker/Dockerfile.triton
      args:
        TRITON_IMAGE: ${TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:26.02-trtllm-python-py3}
        TRTLLM_VERSION: ${TRTLLM_VERSION:-v1.1.0}
    image: open-speech-serve:triton-whisper
    gpus: all
    ipc: host
    ports:
      - "8003:8000"
      - "8004:8001"
      - "8005:8002"
    volumes:
      - ./artifacts/triton:/workspace/artifacts/triton
    entrypoint:
      - python3
      - /opt/TensorRT-LLM/tensorrt_llm/triton_backend/scripts/launch_triton_server.py
    command:
      - --world_size
      - "1"
      - --model_repo
      - /workspace/artifacts/triton/model_repo
      - --tensorrt_llm_model_name
      - tensorrt_llm,whisper_bls
      - --multimodal_gpu0_cuda_mem_pool_bytes
      - "300000000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  hf_cache:
